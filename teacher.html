<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سند التعليمية</title>
<style>
body{font-family:Arial;background:#eef3fa;padding:20px}
main{max-width:400px;margin:40px auto;background:white;padding:24px;border-radius:16px}
input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0}
button{background:#174ea6;color:white;border:0;border-radius:8px}
</style>
</head>
<body>
<main>
<h2>سند التعليمية</h2>
<h3>إنشاء كود طالب</h3>
<input id="key" type="password" placeholder="مفتاح المدرّس">
<input id="student" placeholder="اسم الطالب">
<button onclick="createCode()">إنشاء الكود</button>
<p id="result"></p>
</main>
<script>
async function createCode(){
try{
const r=await fetch('/teacher/create-code',{
method:'POST',
headers:{'Content-Type':'application/json','X-Teacher-Key':document.getElementById('key').value},
body:JSON.stringify({student:document.getElementById('student').value})
});
const d=await r.json();
document.getElementById('result').textContent=r.ok?'كود الطالب: '+d.code:'خطأ: '+d.error;
}catch(e){
document.getElementById('result').textContent='تعذر الاتصال بالسيرفر';
}
}
</script>
</body>
</html>
